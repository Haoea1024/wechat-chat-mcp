<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__TOKEN__"><title>微信项目助理</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#21332c;background:#f4f6f3;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#153e31;color:white;padding:32px max(5vw,24px)}header h1{margin:0 0 9px;font-size:27px}header p{color:#bcd4c8;margin:0}main{max-width:1280px;margin:24px auto;padding:0 24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,input,textarea{font:inherit;border:1px solid #cad6ce;border-radius:7px;padding:9px 12px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e5efe9}button.primary,nav button.active{background:#216b50;color:white;border-color:#216b50}button.small{padding:4px 8px;font-size:12px;margin:3px}input,textarea{width:100%;margin:7px 0 12px}textarea{min-height:85px;resize:vertical}label{display:block;color:#486052;font-size:13px}section[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:white;border:1px solid #dfe6df;border-radius:12px;padding:22px;margin-bottom:16px}.card h2{font-size:19px;margin:0 0 14px}.card h3{font-size:16px;margin:6px 0 12px}.muted,small{color:#688071}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-block;border-radius:6px;padding:4px 8px;background:#eaf2ed;font-size:12px}.error{color:#a33332;background:#fff0ec;padding:12px;border-radius:8px;white-space:pre-wrap}.stat{font-size:27px;margin:4px 0}.item{border-top:1px solid #e7ece7;padding:14px 0}.item p{margin:8px 0}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.empty{padding:30px 0;color:#688071;text-align:center}.filters{margin:14px 0}.notice{position:fixed;right:22px;bottom:22px;max-width:460px;background:#213e30;color:white;padding:14px 20px;border-radius:9px;z-index:9}.notice:empty{display:none}dialog{width:min(740px,94vw);max-height:85vh;border:0;border-radius:12px;padding:25px;box-shadow:0 18px 80px #0003}dialog::backdrop{background:#10261c66}details{margin:12px 0}summary{cursor:pointer;color:#52705c}a{color:#216b50}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.split{grid-template-columns:1fr}header{padding:24px}main{padding:0 14px}.card{padding:16px}}
#status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;padding:0 0 4px}header{padding-top:23px;padding-bottom:23px}.progress{font-size:16px;margin-bottom:18px}.conversation-list{border-left:3px solid #dbe7de;padding-left:14px;margin:16px 0}.conversation{margin:12px 0}.conversation>span{font-size:12px}.conversation p{margin:4px 0}.briefs{display:flex;gap:24px;flex-wrap:wrap;margin:14px 0 20px}.brief{flex:1;min-width:220px}.brief h3{font-size:13px;color:#47705a}.brief ul{margin:0;padding-left:20px;line-height:1.8}.uncertainties h3{color:#926b30}.project-card>details{border-top:1px solid #e7ece7;margin-top:18px;padding-top:12px}.project-card>details>summary{font-size:13px}
</style></head><body><header><div class="row between"><div><h1>微信项目助理</h1><p>看当前进度，知道下一步。</p></div><span class="badge" style="color:#21332c" id="mode">本机运行</span></div></header>
<main><div id="status"></div><nav id="nav"><button data-tab="projects" class="active">进度概览</button><button data-tab="inbox">提醒收件箱</button><button data-tab="search">查聊天 · 提问题</button><button data-tab="settings">设置与运行</button></nav>
<section id="projects"><div class="row between"><p class="muted">只关注你配置的项目；按聊天最新状态总结，推测标明，依据按需展开。</p><div class="row"><button id="add-project">添加项目</button><button id="feedback">我的反馈</button><button id="analyze">更新进度</button></div></div><div id="project-list"></div></section>
<section id="inbox" hidden><p class="muted">每天 08:00 / 12:00 / 18:00（北京时间）汇总有变化的事项，明确紧急事项额外提醒。</p><div id="notification-list"></div></section>
<section id="search" hidden><div class="card"><h2>找消息，或直接问下一步</h2><select id="search-project"><option value="">全部聊天</option></select><textarea id="question" placeholder="例如：科研管理项目现在还缺什么？有哪些事情需要我确认？"></textarea><div class="row"><button class="primary" id="ask">结合聊天回答</button><button id="find">按原文搜索</button><button id="attachments">图片 · 语音 · 文件</button></div><p class="muted">检索使用本地消息；生成回答时，相关片段会发送给所选模型。</p></div><div id="answers"></div></section>
<section id="settings" hidden><div class="split"><div class="card"><h2>采集与提醒</h2><p class="muted">后台每分钟采集本机已有消息，每十分钟分析一批。电脑休眠、退出程序或微信离线期间无法实时提醒。</p><div class="row"><button id="sync">立即采集</button><button id="test-notify">测试桌面提醒</button></div><label>补导入更早记录（天）<input id="backfill-days" type="number" min="1" value="90"></label><button id="backfill">补导入</button><div id="runtime" class="text muted"></div></div>
<form id="settings-form" class="card"><h2>模型与频率</h2><label><input name="background_analysis" type="checkbox" style="width:auto"> 自动分析已配置项目（会使用模型额度）</label><label>模型入口<select name="provider"><option value="codex">现有 Codex 登录</option><option value="api">兼容 Chat Completions 的 API</option></select></label><label>模型名称（Codex 留空使用默认模型）<input name="model"></label><label>Codex 可执行文件<input name="codex_command"></label><label>API Base URL<input name="api_base" placeholder="https://example.com/v1"></label><label>API 密钥环境变量名<input name="api_key_env"></label><label>采集间隔（秒）<input name="poll_seconds" type="number" min="15" max="3600"></label><label>分析间隔（秒）<input name="analysis_seconds" type="number" min="30" max="86400"></label><label>每批分析消息数<input name="batch_size" type="number" min="10" max="500"></label><label>简报时间（北京时间，逗号分隔）<input name="schedule"></label><label><input name="notifications" type="checkbox" style="width:auto"> 启用 Windows 桌面提醒</label><button class="primary">保存设置</button></form></div></section>
</main><dialog id="dialog"><div class="row between"><h2 id="dialog-title">详情</h2><button id="close-dialog">关闭</button></div><div id="dialog-body"></div></dialog><div id="notice" class="notice" role="status"></div><script src="/app.js"></script></body></html>
