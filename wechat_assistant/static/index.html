<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="local-token" content="__TOKEN__"><title>微信项目助理</title><link rel="stylesheet" href="/app.css">
</head>
<body>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="微信项目助理首页"><span class="brand-mark" aria-hidden="true">微</span><span>微信项目助理</span></a>
 <nav id="nav" aria-label="主导航">
  <button data-tab="projects" class="active" aria-current="page"><span aria-hidden="true">▦</span>项目</button>
  <button data-tab="search"><span aria-hidden="true">⌕</span>查找资料</button>
  <button data-tab="inbox"><span aria-hidden="true">▤</span>提醒</button>
  <button data-tab="settings"><span aria-hidden="true">⚙</span>设置</button>
 </nav>
 <div class="sidebar-footer"><span class="connection-dot" aria-hidden="true"></span><span id="mode">本机资料</span></div>
</aside>
<main>
 <div id="status" role="status"></div>
 <section id="projects" aria-labelledby="projects-title">
  <header class="page-heading"><div><h1 id="projects-title">项目</h1><p id="project-count"></p></div><div class="row"><button id="feedback" class="ghost">我的反馈</button><button id="analyze">更新资料</button><button id="add-project" class="primary">＋ 添加项目</button></div></header>
  <div class="project-toolbar"><span id="project-section-title">正在跟踪</span><button id="toggle-archived" class="ghost" hidden>查看已忽略项目</button></div>
  <div id="project-list" class="project-grid"></div>
 </section>
 <section id="search" hidden aria-labelledby="search-title">
  <header class="page-heading"><div><h1 id="search-title">查找资料</h1></div></header>
  <div class="card search-box"><label for="question">查找聊天、文件，或提出问题</label><textarea id="question" placeholder="输入项目名、关键词或你想了解的问题"></textarea><div class="row between"><select id="search-project" aria-label="搜索范围"><option value="">全部聊天</option></select><div class="row"><button id="attachments">浏览附件</button><button id="ask">在对话中提问</button><button class="primary" id="find">搜索原文</button></div></div></div>
  <div id="answers"></div>
 </section>
 <section id="inbox" hidden aria-labelledby="inbox-title"><header class="page-heading"><div><h1 id="inbox-title">提醒</h1></div></header><div id="notification-list"></div></section>
 <section id="settings" hidden aria-labelledby="settings-title">
  <header class="page-heading"><div><h1 id="settings-title">设置</h1></div></header>
  <div class="settings-grid">
   <div><div class="card"><h2>微信同步</h2><p id="sync-summary" class="muted"></p><button id="sync">立即同步</button><details><summary>补充历史记录</summary><label for="backfill-days">导入最近多少天<input id="backfill-days" type="number" min="1" max="3650" value="90"></label><button id="backfill">开始导入</button></details></div>
   <details class="card diagnostics"><summary>运行诊断</summary><pre id="runtime"></pre></details></div>
   <form id="settings-form" class="card"><h2>整理方式</h2>
    <label>由谁整理项目资料<select name="provider"><option value="client">当前 WorkBuddy / Codex 对话</option><option value="codex">独立 Codex CLI</option><option value="api">兼容 API</option></select></label>
    <label>模型名称<input name="model" placeholder="使用默认模型时留空"></label><label>Codex 程序路径<input name="codex_command"></label><label>API 地址<input name="api_base" placeholder="https://example.com/v1"></label><label>密钥环境变量<input name="api_key_env"></label>
    <label class="checkbox-label"><input name="background_analysis" type="checkbox"> 自动整理项目（会使用模型额度）</label>
    <details><summary>同步频率与提醒</summary><label>同步间隔（秒）<input name="poll_seconds" type="number" min="15" max="3600"></label><label>分析间隔（秒）<input name="analysis_seconds" type="number" min="30" max="86400"></label><label>每批消息数<input name="batch_size" type="number" min="10" max="500"></label><label>提醒时间（北京时间）<input name="schedule" placeholder="08:00, 12:00, 18:00"></label><label class="checkbox-label"><input name="notifications" type="checkbox"> 桌面提醒</label><button type="button" id="test-notify">测试提醒</button></details>
    <button class="primary">保存设置</button>
   </form>
  </div>
 </section>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title">详情</h2><button id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
<div id="notice" class="notice" role="status"></div><script src="/app.js"></script>
</body></html>
